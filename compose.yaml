services:
  registry:
    image: takt-registry:local
    build:
      context: .
      target: registry
    container_name: takt-registry
    restart: unless-stopped
    init: true
    ports:
      - "${TAKT_REGISTRY_PORT:-8090}:8090"
    environment:
      TAKT_REGISTRY_ADMIN_PASSWORD: "${TAKT_REGISTRY_ADMIN_PASSWORD:?Set TAKT_REGISTRY_ADMIN_PASSWORD in .env}"
    volumes:
      - "${TAKT_REGISTRY_DATA_PATH:-./registry-data}:/data"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
