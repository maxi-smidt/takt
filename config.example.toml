[application]
fullscreen = true
saved_confirmation_seconds = 2.0

[gpio]
enabled = true
pin_bcm = 17
# Der erste Tastendruck zählt sofort; dieser Wert unterdrückt nur Kontaktprellen.
bounce_seconds = 0.05
double_press_seconds = 0.60

[buzzer]
enabled = false
pin_bcm = 27

[server]
host = "0.0.0.0"
port = 8080

[audio]
enabled = false
output = "off" # "off", "aux" oder "bluetooth"
delay_milliseconds = 3000
settings_path = "~/.config/takt/audio.json"

[display]
chart_default_days = 30
best_runs_limit = 5

[storage]
database_path = "~/.local/share/takt/takt.db"
backup_enabled = true
backup_directory = "~/.local/share/takt/backups"
backup_retention_days = 30
