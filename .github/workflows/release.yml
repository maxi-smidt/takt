name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to bump"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump version in pyproject.toml and src/takt/__init__.py
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          bump = os.environ["BUMP"]

          with open("pyproject.toml", "rb") as f:
              current = tomllib.load(f)["project"]["version"]

          major, minor, patch = (int(part) for part in current.split("."))
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          elif bump == "patch":
              patch = patch + 1
          else:
              raise SystemExit(f"unknown bump kind: {bump!r}")
          new_version = f"{major}.{minor}.{patch}"

          def bump_file(path: str, old_line: str, new_line: str) -> None:
              text = Path(path).read_text(encoding="utf-8")
              if text.count(old_line) != 1:
                  raise SystemExit(
                      f"expected exactly one occurrence of {old_line!r} in {path}"
                  )
              Path(path).write_text(text.replace(old_line, new_line), encoding="utf-8")

          bump_file(
              "pyproject.toml",
              f'version = "{current}"',
              f'version = "{new_version}"',
          )
          bump_file(
              "src/takt/__init__.py",
              f'__version__ = "{current}"',
              f'__version__ = "{new_version}"',
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"version={new_version}\n")
          PY

      # A previous attempt (e.g. a retried run) may have left a stale
      # release branch and/or PR behind — clear it so this run can push a
      # fresh branch instead of hitting a non-fast-forward rejection. Uses
      # the plain REST API (gh api), not the GraphQL-backed `gh pr`
      # porcelain commands — see the "Open the release PR" step below.
      - name: Clean up a stale branch/PR from a previous attempt
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -Eeuo pipefail
          existing_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls" \
            -f head="${GITHUB_REPOSITORY_OWNER}:release/v${NEW_VERSION}" -f state=open \
            --jq '.[0].number // empty' 2>/dev/null || true)"
          if [[ -n "$existing_pr" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${existing_pr}" -f state=closed >/dev/null || true
          fi
          git push origin --delete "release/v${NEW_VERSION}" 2>/dev/null || true

      - name: Commit bump to a release branch
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v${NEW_VERSION}"
          git add pyproject.toml src/takt/__init__.py
          git commit -m "Prepare release ${NEW_VERSION}"
          git push origin "release/v${NEW_VERSION}"

      # main is protected and requires the "quality" check to pass, so we
      # can't push the bump commit directly — go through a PR instead.
      #
      # `gh pr create`/`gh pr view`/`gh pr merge` go through GitHub's
      # GraphQL API, which has proven less reliable than the plain REST
      # API during GitHub incidents — so this and the following steps use
      # `gh api` (REST) throughout, plus a retry helper for transient 5xx
      # errors.
      - name: Open the release PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -Eeuo pipefail
          retry() {
            local attempt=1 max_attempts=5 delay=5
            until "$@"; do
              if (( attempt >= max_attempts )); then
                return 1
              fi
              printf 'Command failed (attempt %s/%s), retrying in %ss: %s\n' \
                "$attempt" "$max_attempts" "$delay" "$*" >&2
              sleep "$delay"
              attempt=$(( attempt + 1 ))
              delay=$(( delay * 2 ))
            done
          }
          pr_number="$(retry gh api "repos/${GITHUB_REPOSITORY}/pulls" \
            -f title="Prepare release ${NEW_VERSION}" \
            -f head="release/v${NEW_VERSION}" \
            -f base="main" \
            -f body="Automated version bump. Merges once the \`quality\` check passes, tags \`v${NEW_VERSION}\`, and explicitly re-triggers the release pipeline (a push made with this workflow's own token can't trigger it on its own)." \
            --jq .number)"
          printf 'number=%s\n' "$pr_number" >> "$GITHUB_OUTPUT"

      - name: Wait for the required check, then squash-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -Eeuo pipefail
          retry() {
            local attempt=1 max_attempts=5 delay=5
            until "$@"; do
              if (( attempt >= max_attempts )); then
                return 1
              fi
              printf 'Command failed (attempt %s/%s), retrying in %ss: %s\n' \
                "$attempt" "$max_attempts" "$delay" "$*" >&2
              sleep "$delay"
              attempt=$(( attempt + 1 ))
              delay=$(( delay * 2 ))
            done
          }
          elapsed=0
          timeout_seconds=1800
          interval=15
          while true; do
            if conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/release%2Fv${NEW_VERSION}/check-runs" \
                --jq '[.check_runs[] | select(.name == "quality")][0].conclusion // "pending"' 2>/dev/null)"; then
              :
            else
              conclusion="pending"
            fi
            case "$conclusion" in
              success)
                break
                ;;
              failure | cancelled | timed_out | action_required | stale)
                printf 'Required "quality" check finished with conclusion: %s\n' "$conclusion" >&2
                exit 1
                ;;
            esac
            if (( elapsed >= timeout_seconds )); then
              printf 'Timed out waiting for the "quality" check to complete\n' >&2
              exit 1
            fi
            sleep "$interval"
            elapsed=$(( elapsed + interval ))
          done
          retry gh api -X PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" -f merge_method=squash
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads%2Frelease%2Fv${NEW_VERSION}" >/dev/null || true

      - name: Tag the merged release commit
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git tag "v${NEW_VERSION}" origin/main
          git push origin "v${NEW_VERSION}"

      # GitHub Actions deliberately does not let a push made with a workflow's
      # own GITHUB_TOKEN trigger other workflows (anti-recursion protection) --
      # this applies to both the squash-merge above and the tag push just above,
      # so "Publish TAKT distributions" (which builds/pushes the container image
      # and creates the GitHub Release) would otherwise silently never run for
      # an automated release. Dispatching it directly, scoped to the new tag,
      # is not a cascading event and works fine with GITHUB_TOKEN.
      - name: Trigger the publish workflow for the new tag
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -Eeuo pipefail
          gh workflow run registry-image.yml --ref "v${NEW_VERSION}"
