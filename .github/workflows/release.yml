name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to bump"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump version in pyproject.toml and src/takt/__init__.py
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          bump = os.environ["BUMP"]

          with open("pyproject.toml", "rb") as f:
              current = tomllib.load(f)["project"]["version"]

          major, minor, patch = (int(part) for part in current.split("."))
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          elif bump == "patch":
              patch = patch + 1
          else:
              raise SystemExit(f"unknown bump kind: {bump!r}")
          new_version = f"{major}.{minor}.{patch}"

          def bump_file(path: str, old_line: str, new_line: str) -> None:
              text = Path(path).read_text(encoding="utf-8")
              if text.count(old_line) != 1:
                  raise SystemExit(
                      f"expected exactly one occurrence of {old_line!r} in {path}"
                  )
              Path(path).write_text(text.replace(old_line, new_line), encoding="utf-8")

          bump_file(
              "pyproject.toml",
              f'version = "{current}"',
              f'version = "{new_version}"',
          )
          bump_file(
              "src/takt/__init__.py",
              f'__version__ = "{current}"',
              f'__version__ = "{new_version}"',
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"version={new_version}\n")
          PY

      - name: Commit bump to a release branch
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v${NEW_VERSION}"
          git add pyproject.toml src/takt/__init__.py
          git commit -m "Prepare release ${NEW_VERSION}"
          git push origin "release/v${NEW_VERSION}"

      # main is protected and requires the "quality" check to pass, so we
      # can't push the bump commit directly — go through a PR instead.
      - name: Open the release PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -Eeuo pipefail
          gh pr create \
            --base main \
            --head "release/v${NEW_VERSION}" \
            --title "Prepare release ${NEW_VERSION}" \
            --body "Automated version bump. Merges once the \`quality\` check passes; merging tags \`v${NEW_VERSION}\`, which triggers the release pipeline."
          pr_number="$(gh pr view "release/v${NEW_VERSION}" --json number --jq .number)"
          printf 'number=%s\n' "$pr_number" >> "$GITHUB_OUTPUT"

      - name: Wait for the required check, then squash-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -Eeuo pipefail
          elapsed=0
          timeout_seconds=1800
          interval=15
          while true; do
            conclusion="$(gh pr view "$PR_NUMBER" --json statusCheckRollup \
              --jq '[.statusCheckRollup[] | select(.name == "quality")][0].conclusion // "PENDING"')"
            case "$conclusion" in
              SUCCESS)
                break
                ;;
              FAILURE | CANCELLED | TIMED_OUT | STARTUP_FAILURE | ACTION_REQUIRED)
                printf 'Required "quality" check finished with conclusion: %s\n' "$conclusion" >&2
                exit 1
                ;;
            esac
            if (( elapsed >= timeout_seconds )); then
              printf 'Timed out waiting for the "quality" check to complete\n' >&2
              exit 1
            fi
            sleep "$interval"
            elapsed=$(( elapsed + interval ))
          done
          gh pr merge "$PR_NUMBER" --squash --delete-branch

      - name: Tag the merged release commit
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git tag "v${NEW_VERSION}" origin/main
          git push origin "v${NEW_VERSION}"
