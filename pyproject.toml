[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "takt"
version = "0.1.0"
description = "Offline Feuerwehr-Zeitnahme für Raspberry Pi und Laptop"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "PySide6-Essentials>=6.6,<7",
]

[project.optional-dependencies]
gpio = ["gpiozero>=2.0,<3"]
dev = [
  "pytest>=8,<9",
  "pytest-qt>=4.4,<5",
  "ruff>=0.9,<1",
]

[project.scripts]
takt = "takt.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
