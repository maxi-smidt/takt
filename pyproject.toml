[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "takt"
version = "0.4.0"
description = "Offline Feuerwehr-Zeitnahme für Raspberry Pi und Laptop"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.6,<7"]
gpio = ["gpiozero>=2.0,<3"]
server = ["aiohttp>=3.10,<4"]
registry = [
  "fastapi>=0.115.14,<1",
  "pydantic>=2.9,<3",
  "starlette>=0.45,<1",
  "python-multipart>=0.0.18,<1",
  "uvicorn>=0.30,<1",
  "asyncssh>=2.18,<3",
  "cryptography>=43,<50",
]
dev = [
  "aiohttp>=3.10,<4",
  "fastapi>=0.115.14,<1",
  "pydantic>=2.9,<3",
  "starlette>=0.45,<1",
  "asyncssh>=2.18,<3",
  "cryptography>=43,<50",
  "httpx>=0.27,<1",
  "PySide6-Essentials>=6.6,<7",
  "python-multipart>=0.0.18,<1",
  "pytest>=8,<9",
  "pytest-qt>=4.4,<5",
  "ruff>=0.9,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
takt = "takt.main:main"
takt-server = "takt.server_main:main"
takt-agent = "takt.management.agent:main"
takt-registry = "takt.registry.server_main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"takt" = ["assets/*.wav", "assets/*.mp3"]
"takt.web" = ["static/**/*"]
"takt.registry" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
